name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile and test
        shell: pwsh
        run: ./Build.ps1
      - name: Render native WPF layouts without replacing the taskbar
        shell: pwsh
        run: |
          $output=Join-Path $PWD 'artifacts/native-layouts'
          $process=Start-Process './artifacts/windows-x64/Windeck.exe' -ArgumentList @('--verify-layouts',"`"$output`"") -PassThru
          if(-not $process.WaitForExit(90000)){
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw 'Native layout verification timed out.'
          }
          if($process.ExitCode -ne 0){
            Get-Content "$output/failure.txt" -ErrorAction SilentlyContinue
            Get-Content "$env:LOCALAPPDATA/Windeck/windeck.log" -ErrorAction SilentlyContinue
            throw "Native layout verification failed: $($process.ExitCode)"
          }
          $report=Get-Content "$output/verification.json" -Raw | ConvertFrom-Json
          if($report.status -ne 'passed' -or $report.replacementEnabled -or $report.layouts.Count -ne 16){throw 'Invalid native layout report.'}
      - name: Package portable executable
        shell: pwsh
        run: ./Package.ps1 -NoBuild
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-layout-verification
          path: artifacts/native-layouts
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: Windeck-windows-x64
          path: |
            artifacts/Windeck-windows-x64.zip
            artifacts/Windeck-windows-x64.zip.sha256
          if-no-files-found: error
      - name: Publish tagged alpha
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "$env:GITHUB_REF_NAME" 'artifacts/Windeck-windows-x64.zip' 'artifacts/Windeck-windows-x64.zip.sha256' --title "Windeck $env:GITHUB_REF_NAME" --notes-file RELEASE-NOTES.md --prerelease --verify-tag
    permissions:
      contents: write
